name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

            - name: unpack
        shell: bash
        run: |
          unzip -o BowlMod-InGame.zip
          F=app/src/main/java/com/bowlingcrew/mod/Touch.java
          python3 - "$F" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace("import android.view.MotionEvent;",
                        "import android.view.InputDevice;\nimport android.view.MotionEvent;")
          s = s.replace("MotionEvent.SOURCE_TOUCHSCREEN",
                        "InputDevice.SOURCE_TOUCHSCREEN")
          open(p, "w").write(s)
          EOF
          grep -n "InputDevice" "$F"

      - name: build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BowlMod-apk
          path: app/build/outputs/apk/debug/app-debug.apk
